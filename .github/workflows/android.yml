name: Build and Release Embun APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Read version from package.json
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm install

      - name: Create Android project if missing
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "embun-${{ steps.ver.outputs.version }}v.apk"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Embun ${{ steps.ver.outputs.version }}
          files: embun-${{ steps.ver.outputs.version }}v.apk
          overwrite_files: true
          generate_release_notes: true

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: embun-${{ steps.ver.outputs.version }}v
          path: embun-${{ steps.ver.outputs.version }}v.apk
