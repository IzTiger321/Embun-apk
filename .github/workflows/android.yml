name: Build Embun APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Read version from package.json
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm install

      - name: Download app icon
        run: |
          mkdir -p resources
          curl -fL -o resources/icon.png "https://image.nostr.build/resp/orig/4050ad55fb03d3423970af01beda84dcbd16e5cf5b6b21525a37116e4eed0435.png"

      - name: Create Android project if missing
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Generate Android icons
        run: npx --yes @capacitor/assets generate --android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "embun-${{ steps.ver.outputs.version }}v.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: embun-${{ steps.ver.outputs.version }}v
          path: embun-${{ steps.ver.outputs.version }}v.apk
